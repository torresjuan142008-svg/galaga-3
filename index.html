<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Galaga del Amor 💖</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: linear-gradient(to bottom, #0a001a, #1a0033);
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
    touch-action: none;
}

canvas {
    display: block;
    margin: 0 auto;
    background: radial-gradient(circle, #180030, #000);
    border: 3px solid #ff69b4;
}

#score {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 24px;
    font-weight: bold;
    color: #ffb6d9;
    z-index: 10;
    text-shadow: 0 0 10px #ff69b4;
}

#lives {
    position: fixed;
    top: 10px;
    right: 10px;
    font-size: 24px;
    font-weight: bold;
    color: #87cefa;
    z-index: 10;
    text-shadow: 0 0 10px #00bfff;
}

#message {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
}

#messageBox {
    background: #1a0033;
    border: 3px solid hotpink;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    max-width: 90%;
}

#messageBox h2 {
    margin-bottom: 20px;
    color: #ffb6d9;
    line-height: 1.5;
}

#messageBox button {
    padding: 12px 25px;
    font-size: 20px;
    background: hotpink;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

#controls {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 15px;
    z-index: 15;
}

.control-btn {
    width: 80px;
    height: 80px;
    border: none;
    border-radius: 50%;
    font-size: 30px;
    background: rgba(255, 105, 180, 0.85);
    color: white;
    box-shadow: 0 0 15px rgba(255,105,180,0.6);
    cursor: pointer;
    user-select: none;
}

.control-btn:active {
    transform: scale(0.95);
    background: deeppink;
}

@media (max-width: 600px) {
    .control-btn {
        width: 70px;
        height: 70px;
        font-size: 26px;
    }

    #score, #lives {
        font-size: 18px;
    }
}
</style>
</head>
<body>

<div id="score">Puntos: 0</div>
<div id="lives">Vidas: 10 ❤️</div>

<canvas id="gameCanvas"></canvas>

<div id="message">
    <div id="messageBox">
        <h2 id="messageText"></h2>
        <button id="rewardButton">🎁 Abrir Premio</button>
    </div>
</div>

<div id="controls">
    <button class="control-btn" id="leftBtn">⬅️</button>
    <button class="control-btn" id="shootBtn">💖</button>
    <button class="control-btn" id="rightBtn">➡️</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const message = document.getElementById("message");
const messageText = document.getElementById("messageText");
const rewardButton = document.getElementById("rewardButton");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const shootBtn = document.getElementById("shootBtn");

function resizeCanvas() {
    canvas.width = Math.min(window.innerWidth, 480);
    canvas.height = window.innerHeight - 120;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// Estado del juego
let score = 0;
let lives = 10;
let bullets = [];
let enemies = [];
let gameRunning = true;
let moveLeft = false;
let moveRight = false;

let reward3000Shown = false;
let reward10000Shown = false;

// Jugador
const player = {
    x: 200,
    y: 0,
    width: 80,
    height: 50,
    speed: 6
};

function updateHUD() {
    scoreEl.textContent = "Puntos: " + score;
    livesEl.textContent = "Vidas: " + lives + " ❤️";
}

function updatePlayerPosition() {
    player.y = canvas.height - 70;
    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
}

// Dibujar jugador
function drawPlayer() {
    ctx.fillStyle = "#ff69b4";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    ctx.fillStyle = "white";
    ctx.font = "bold 14px Arial";
    ctx.fillText("Valeria", player.x + 8, player.y + 30);
}

// Dibujar disparos
function drawBullets() {
    bullets.forEach(b => {
        ctx.font = "20px Arial";
        ctx.fillText("💖", b.x, b.y);
    });
}

// Dibujar enemigos
function drawEnemies() {
    enemies.forEach(e => {
        ctx.font = "28px Arial";
        ctx.fillText("💙", e.x, e.y);
    });
}

// Disparar
function shoot() {
    if (!gameRunning) return;

    bullets.push({
        x: player.x + player.width / 2 - 10,
        y: player.y
    });
}

// Generar enemigos con dificultad progresiva
function spawnEnemies() {
    let spawnRate = 0.02;
    let minSpeed = 2.5;
    let maxSpeed = 4.5;

    const level = Math.floor(score / 1000);

    spawnRate += level * 0.003;
    minSpeed += level * 0.2;
    maxSpeed += level * 0.3;

    spawnRate = Math.min(spawnRate, 0.06);
    minSpeed = Math.min(minSpeed, 6);
    maxSpeed = Math.min(maxSpeed, 8);

    if (Math.random() < spawnRate) {
        enemies.push({
            x: Math.random() * (canvas.width - 30),
            y: -20,
            speed: minSpeed + Math.random() * (maxSpeed - minSpeed)
        });
    }
}

// Actualizar disparos
function updateBullets() {
    bullets.forEach(b => b.y -= 8);
    bullets = bullets.filter(b => b.y > -30);
}

// Actualizar enemigos
function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].y += enemies[i].speed;

        if (enemies[i].y > canvas.height) {
            enemies.splice(i, 1);
            lives--;
            updateHUD();

            if (lives <= 0) {
                gameOver();
                return;
            }
        }
    }
}

// Colisiones
function checkCollisions() {
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
            const b = bullets[bi];
            const e = enemies[ei];

            if (
                b.x < e.x + 25 &&
                b.x + 20 > e.x &&
                b.y < e.y + 25 &&
                b.y + 20 > e.y
            ) {
                bullets.splice(bi, 1);
                enemies.splice(ei, 1);
                score += 50;
                updateHUD();
                break;
            }
        }
    }
}

// Mostrar mensaje
function showReward(title, rewardText, buttonText = "🎁 Abrir Premio") {
    gameRunning = false;
    message.style.display = "flex";
    messageText.innerHTML = title;
    rewardButton.textContent = buttonText;

    rewardButton.onclick = () => {
        alert(rewardText);
        message.style.display = "none";
        gameRunning = true;
        gameLoop();
    };
}

// Premios
function checkRewards() {
    if (score >= 3000 && !reward3000Shown) {
        reward3000Shown = true;
        showReward("💝 ¡Ganaste un premio!", "😘 Tu premio es un beso.");
        return true;
    }

    if (score >= 10000 && !reward10000Shown) {
        reward10000Shown = true;
        showReward(
            "🎁 ¡Ganaste el premio final!",
            "💖 Tu regalo misterioso es una sorpresa muy especial."
        );
        return true;
    }

    return false;
}

// Game Over
function gameOver() {
    gameRunning = false;
    message.style.display = "flex";
    messageText.innerHTML =
        "💖 Amor, acabas de perder.<br><br>Vuelve a intentarlo, tú puedes. 💪💕<br><br>Puntaje final: " + score;

    rewardButton.textContent = "🔄 Reiniciar";

    rewardButton.onclick = () => {
        location.reload();
    };
}

// Bucle principal
function gameLoop() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (moveLeft) player.x -= player.speed;
    if (moveRight) player.x += player.speed;

    updatePlayerPosition();

    spawnEnemies();
    updateBullets();
    updateEnemies();

    if (!gameRunning) return;

    checkCollisions();

    drawPlayer();
    drawBullets();
    drawEnemies();

    if (checkRewards()) return;

    requestAnimationFrame(gameLoop);
}

// Mantener botones presionados
function bindHoldButton(button, startFn, endFn) {
    const start = (e) => {
        e.preventDefault();
        startFn();
    };

    const end = (e) => {
        e.preventDefault();
        endFn();
    };

    button.addEventListener("mousedown", start);
    button.addEventListener("mouseup", end);
    button.addEventListener("mouseleave", end);

    button.addEventListener("touchstart", start, { passive: false });
    button.addEventListener("touchend", end);
    button.addEventListener("touchcancel", end);
}

bindHoldButton(leftBtn,
    () => moveLeft = true,
    () => moveLeft = false
);

bindHoldButton(rightBtn,
    () => moveRight = true,
    () => moveRight = false
);

// Botón disparar
shootBtn.addEventListener("click", shoot);
shootBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    shoot();
}, { passive: false });

// Teclado
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") moveLeft = true;
    if (e.key === "ArrowRight") moveRight = true;
    if (e.key === " ") shoot();
});

document.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft") moveLeft = false;
    if (e.key === "ArrowRight") moveRight = false;
});

// Iniciar juego
updateHUD();
gameLoop();
</script>

</body>
</html>
